[package]
name = "termius-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Termius cloud sync API client over reqwest: device token auth, host/snippet/keychain/group sync, brand theming, account. Replaces the JS sync/saga layer."

[dependencies]
termius-core = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
# hex(SHA-256(password)) for the device-login payload (`NS.generateHash` in
# the recovered JS). Both are already declared in the workspace [dependencies]
# — no root Cargo.toml change was needed.
sha2 = { workspace = true }
hex = { workspace = true }
