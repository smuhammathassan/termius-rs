name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Core engines + storage + terminal — build and test on Linux (no GPUI).
  core:
    name: core (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (core crates)
        run: >
          cargo check --workspace --all-targets
          --exclude termius-ui --exclude termius-app
      - name: cargo test (core crates)
        run: >
          cargo test --workspace
          --exclude termius-ui --exclude termius-app

  # Full app including the GPUI UI crate — build and test on macOS.
  app:
    name: app (macos, incl. gpui)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace)
        run: cargo check --workspace --all-targets
      - name: cargo test (workspace)
        run: cargo test --workspace --all-targets

  clippy:
    name: clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (core crates)
        run: >
          cargo clippy --workspace --all-targets
          --exclude termius-ui --exclude termius-app
